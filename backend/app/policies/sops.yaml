# ----- SOP-001: High Wind Running -----
- id: SOP-001
  name: High Wind Running
  category: outdoor_exercise
  severity: high
  type: standard

  applies_when:
    all:
      - field: wind_speed_kmh
        operator: gte
        value: 40
      - field: activity_category
        operator: in
        value:
          - running
          - jogging
          - outdoor_exercise

  guidance:
    - Avoid running in exposed areas under these wind conditions.
    - Consider an indoor alternative or postpone.
    - Check conditions again before starting.

  rationale: "Strong winds can affect balance and make exposed outdoor exercise less predictable."
  priority: 70

