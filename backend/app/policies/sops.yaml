  name: Extreme Gust Advisory — Water
  category: water_activity
  severity: critical
  type: standard

  applies_when:
    all:
      - field: wind_gusts_kmh
        operator: gte
        value: 80
      - field: activity_category
        operator: in
        value:
          - boating
          - kayaking
          - canoeing
          - water_activity

  guidance:
    - Consider whether the activity can be moved to a sheltered setting.
    - Exercise additional caution in exposed areas.
    - Recheck live conditions before departure.

  rationale: "Extreme Gust Advisory applies when the configured weather threshold is reached for water."
  priority: 95

