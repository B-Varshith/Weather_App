  type: standard

  applies_when:
    all:
      - field: weather_code
        operator: in
        value:
          - 95
          - 96
          - 99

  guidance:
    - Avoid outdoor activities.
    - Seek appropriate shelter.
    - Recheck conditions before leaving.

  rationale: "Severe thunderstorm weather codes indicate conditions requiring caution."
  priority: 100

# ----- SOP-275: Snow Detected Outdoor Activity -----
- id: SOP-275
  name: Snow Detected Outdoor Activity
  category: global
  severity: moderate
  type: standard

  applies_when:
    all:
      - field: snowfall_mm
        operator: gte
        value: 1

  guidance:
    - Check route and surface conditions before outdoor activity.
    - Allow additional travel time if needed.
    - Recheck conditions before departure.

  rationale: "Snow can affect outdoor surfaces and travel conditions."
  priority: 50

