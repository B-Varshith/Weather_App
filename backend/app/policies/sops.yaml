# ----- SOP-267: Rain + Wind Outdoor Activity -----
- id: SOP-267
  name: Rain + Wind Outdoor Activity
  category: general_outdoor
  severity: high
  type: composite

  applies_when:
    all:
      - field: precipitation_probability
        operator: gte
        value: 60
      - field: wind_speed_kmh
        operator: gte
        value: 35

  guidance:
    - Consider postponing exposed outdoor activities.
    - Use shelter where available.
    - Recheck live conditions before leaving.

  rationale: "Combined rain probability and strong wind can make exposed outdoor activity less suitable."
  priority: 75

# ----- SOP-268: Heat + High UV Exercise -----
- id: SOP-268
  name: Heat + High UV Exercise
  category: outdoor_exercise
  severity: high
  type: composite

  applies_when:
    all:
      - field: temperature_c
        operator: gte
        value: 35
      - field: uv_index
        operator: gte
        value: 7

  guidance:
    - Prefer cooler hours.
    - Use sun protection.
    - Reduce prolonged outdoor exposure.

  rationale: "Combined high temperature and high UV increase outdoor exposure."
  priority: 85

# ----- SOP-269: Rain + Low Visibility Travel -----
- id: SOP-269
  name: Rain + Low Visibility Travel
  category: travel
  severity: high
  type: composite

  applies_when:
    all:
      - field: precipitation_probability
        operator: gte
        value: 70
      - field: visibility_m
        operator: lte
        value: 2000

  guidance:
    - Consider delaying non-essential travel.
    - Check official traffic and weather information.
    - Allow additional travel time.

  rationale: "Rain combined with reduced visibility can make travel more difficult."
  priority: 85

# ----- SOP-270: Wind + Gust Travel -----
- id: SOP-270
  name: Wind + Gust Travel
  category: travel
  severity: high
  type: composite

  applies_when:
    all:
      - field: wind_speed_kmh
        operator: gte
        value: 40
      - field: wind_gusts_kmh
        operator: gte
        value: 60

  guidance:
    - Consider delaying non-essential travel.
    - Check official weather alerts.
    - Use additional caution if travel is necessary.

  rationale: "Strong sustained wind combined with strong gusts can create challenging travel conditions."
  priority: 90

# ----- SOP-271: Rain + Wind Picnic -----
- id: SOP-271
  name: Rain + Wind Picnic
  category: general_outdoor
  severity: moderate
  type: composite

  applies_when:
    all:
      - field: precipitation_probability
        operator: gte
        value: 50
      - field: wind_speed_kmh
        operator: gte
        value: 30

  guidance:
    - Consider rescheduling the picnic.
    - Choose an indoor or sheltered alternative.
    - Recheck conditions before leaving.

  rationale: "Rain probability combined with wind can make a picnic impractical."
  priority: 45

# ----- SOP-272: Heat + UV Picnic -----
- id: SOP-272
  name: Heat + UV Picnic
  category: general_outdoor
  severity: moderate
  type: composite

  applies_when:
    all:
      - field: temperature_c
        operator: gte
        value: 33
      - field: uv_index
        operator: gte
        value: 7

  guidance:
    - Prefer shade and cooler hours.
    - Use sun protection.
    - Keep the outdoor stay shorter if conditions remain uncomfortable.

  rationale: "Combined heat and UV can make prolonged outdoor stays less suitable."
  priority: 55

# ----- SOP-273: Thunderstorm Detected -----
- id: SOP-273
  name: Thunderstorm Detected
  category: global
  severity: critical
  type: standard

  applies_when:
    all:
      - field: is_thunderstorm
        operator: gte
        value: true

  guidance:
    - Avoid outdoor activities while thunderstorms are present.
    - Seek appropriate shelter.
    - Wait for conditions to clear.

  rationale: "Thunderstorms can create immediate outdoor hazards."
  priority: 100

# ----- SOP-274: Weather Code Severe Thunderstorm -----
- id: SOP-274
  name: Weather Code Severe Thunderstorm
  category: global
